set-option -g default-shell /run/current-system/sw/bin/fish

set-option -ga terminal-overrides ",*256col*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0
setw -g mouse on
set-option -g detach-on-destroy off

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H choose-window "join-pane -v -s "%%""
bind V choose-window "join-pane -h -s "%%""
set-option -g status-style 'bg=default fg=#a89984'
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer"



# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour0'
set -g status-left ' #S '
set -g status-left-style 'bg=color12 fg=#1d2021 bold'
set -g status-right '%Y-%m-%d %H:%M:%S '
set -g status-right-style 'fg=color8'
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=#1d2021 bg=colour13 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#a89984'
setw -g window-status-format ' #I #[fg=#color0]#W #[fg=colour1]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'
