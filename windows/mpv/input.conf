ctrl+RIGHT script-binding uosc/next
ctrl+LEFT script-binding uosc/prev

# Toggle dynamic audio normalization without disturbing other audio filters.
ctrl+n af toggle @normalize

shift+RIGHT add chapter 1
shift+LEFT add chapter -1


shift+p script-binding uosc/items

MBTN_RIGHT cycle pause
Shift+MBTN_RIGHT script-binding select/context-menu

MBTN_BACK script-binding uosc/next
MBTN_FORWARD  add chapter 1
