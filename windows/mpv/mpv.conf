# uosc provides seeking & volume indicators (via flash-timeline and flash-volume commands)
# if you decide to use them, you don't need osd-bar
osd-bar=no

# uosc will draw its own window controls and border if you disable window border
border=no
audio-file-auto=fuzzy

# don't close mpv on file end
keep-open

screenshot-format=png

# Consistent stereo downmix, with headroom to avoid clipping.
audio-channels=stereo
audio-normalize-downmix=yes
ad-lavc-downmix=no

# Dynamic normalization: OFF by default; Ctrl+N toggles this labeled filter.
# 250 ms frames, 31-frame smoothing, at most 5x gain, 95% peak ceiling.
# Skip gain adjustment below 0.001 (-60 dBFS) to avoid boosting near-silence.
af=@normalize:!lavfi=[dynaudnorm=f=250:g=31:m=5:p=0.95:t=0.001]
